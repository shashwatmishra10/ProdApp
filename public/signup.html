<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#22C55E">
<title>Sign up • Minto</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">M</div>
    <h1>Create your account</h1>
    <p class="sub">Your personal money companion</p>
    <div class="auth-error" id="error"></div>
    <form id="signupForm">
      <div class="auth-field"><label>Name</label><input type="text" id="name" required autocomplete="name"></div>
      <div class="auth-field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
      <div class="auth-field"><label>Password</label><input type="password" id="password" required minlength="8" autocomplete="new-password"></div>
      <button class="auth-submit" type="submit">Create account</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="/login.html">Log in</a></div>
  </div>
</div>
<script>
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("error");
  errorEl.style.display = "none";
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  try {
    const res = await fetch("/api/auth/signup", {
      method: "POST",
      headers: { "content-type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ name, email, password }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Sign up failed");
    window.location.href = "/";
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = "block";
  }
});
</script>
</body>
</html>
